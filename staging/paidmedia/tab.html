<!-- NAV BUTTON: <button class="tab-btn" data-tab="paidmedia">Paid Media Agent</button> -->

<section class="tab-pane" id="tab-paidmedia">

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <div class="sec-header mb16">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <h2 class="sec-title">Paid Media Agent</h2>
      <span class="badge b-soon" id="pmLastUpdated" style="font-size:10px;">—</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <!-- Platform switcher -->
      <div style="display:flex;gap:4px;" id="pmPlatformSwitcher">
        <button class="range-btn active" id="pmBtn-tiktok" onclick="switchPlatform('tiktok')">
          ♪ TikTok Ads
        </button>
        <button class="range-btn" id="pmBtn-meta" onclick="switchPlatform('meta')">
          f Meta Ads
        </button>
      </div>
      <!-- Date range -->
      <div style="display:flex;gap:4px;" id="pmDateRange">
        <button class="range-btn active" id="pmRange-7d"  onclick="setPmRange('7d')">7D</button>
        <button class="range-btn"        id="pmRange-30d" onclick="setPmRange('30d')">30D</button>
        <button class="range-btn"        id="pmRange-custom" onclick="setPmRange('custom')">Custom</button>
      </div>
      <button class="btn btn-ghost" id="pmRefreshBtn" onclick="loadPaidMedia(true)" style="height:32px;padding:0 12px;font-size:11px;">
        ↺ Refresh
      </button>
    </div>
  </div>

  <!-- ── Custom date range (hidden by default) ──────────────────────────── -->
  <div id="pmCustomRange" style="display:none;margin-bottom:16px;display:none;">
    <div class="card" style="padding:14px 20px;">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <label style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;">From</label>
        <input type="date" id="pmDateFrom" class="agent-input" style="width:160px;">
        <label style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;">To</label>
        <input type="date" id="pmDateTo" class="agent-input" style="width:160px;">
        <button class="btn btn-teal" onclick="loadPmReport()" style="height:32px;padding:0 14px;font-size:12px;">Apply</button>
      </div>
    </div>
  </div>

  <!-- ── Main content (rendered by JS) ─────────────────────────────────── -->
  <div id="pmContent">
    <div style="color:var(--muted);font-style:italic;padding:40px 0;text-align:center;font-size:13px;">
      Loading Paid Media data…
    </div>
  </div>

</section>

<!-- ─── Paid Media tab templates (rendered via JS into #pmContent) ──────────

  The JS functions in functions.js build all inner HTML dynamically.
  This section documents the expected rendered structure for reference.

  renderPaidMedia() outputs into #pmContent:

  1. Connection status cards  (if not connected)
  2. KPI row                  (6 cards)
  3. Spend Pacing card
  4. Campaign table card
  5. Top Creative card
  6. Quick Actions card

────────────────────────────────────────────────────────────────────────── -->
